<title>CAP SUP — Plateforme de révision</title>
<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--p2);outline-offset:2px}
.btn{background:linear-gradient(135deg,var(--p),var(--p2));padding:10px 18px;border-radius:12px;font-weight:600;box-shadow:0 0 22px #8b5cf655}
.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none}.btn.sm{padding:6px 12px;font-size:13px}
input,select{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
label{font-size:13px;color:var(--mu);display:block;margin:12px 0 4px}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#4c1d95 0,transparent 55%),var(--bg);padding:20px}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;max-width:420px;width:100%;box-shadow:0 0 60px #8b5cf633}
.logo{font-size:26px;font-weight:800;background:linear-gradient(90deg,var(--p2),#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
#app{display:none}
nav{position:fixed;left:0;top:0;bottom:0;width:220px;background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;z-index:5}
nav button{background:transparent;text-align:left;padding:11px 14px;border-radius:12px;color:var(--mu);white-space:nowrap}
nav button.on,nav button:hover{background:var(--card);color:var(--tx);box-shadow:inset 3px 0 var(--p)}
main{margin-left:220px;padding:28px;max-width:1150px}
h1{margin:0 0 6px;font-size:26px}h2{margin:0 0 12px;font-size:18px}p.sub{color:var(--mu);margin:0 0 22px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 0 30px #8b5cf61a}
.big{font-size:30px;font-weight:800;color:var(--p2)}.mu{color:var(--mu);font-size:14px}
.bar{height:9px;background:var(--panel);border-radius:9px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--p2));border-radius:9px;transition:width .6s}
.tag{display:inline-block;font-size:12px;padding:3px 10px;border-radius:20px;background:#8b5cf633;color:var(--p2);margin:0 6px 4px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}.row>input,.row>select{flex:1;min-width:140px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{background:var(--panel);border:1px solid var(--line);padding:8px 16px;border-radius:20px;color:var(--mu)}
.tabs button.on{background:var(--p);color:#fff;border-color:var(--p)}
.fiche{cursor:pointer;transition:.2s}.fiche:hover{transform:translateY(-3px);border-color:var(--p)}
.formula{background:var(--panel);border-left:3px solid var(--p);padding:8px 12px;border-radius:8px;margin:8px 0;font-family:ui-monospace,Menlo,monospace}
.opt{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);padding:12px 14px;border-radius:12px;margin:8px 0}
.opt:hover:not(:disabled){border-color:var(--p)}.opt.ok{border-color:var(--ok);background:#34d39922}.opt.ko{border-color:var(--ko);background:#f8717122}
.task{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.task input{width:auto}.task span{flex:1}.task.done span{text-decoration:line-through;color:var(--mu)}
.chart{display:flex;align-items:flex-end;gap:8px;height:110px}.chart div{flex:1;text-align:center;font-size:12px;color:var(--mu)}
.chart b{display:block;background:linear-gradient(var(--p2),var(--p));border-radius:6px 6px 0 0;min-height:3px}
.price{text-align:center}.price .big{font-size:34px}.price.hot{border-color:var(--p2);box-shadow:0 0 40px #c084fc55}
.price ul{padding:0;margin:14px 0}.price li{list-style:none;margin:8px 0;color:var(--mu)}
.badge{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:20px;background:var(--panel);margin:0 6px 8px 0;font-size:13px}.badge.off{opacity:.35}
.ic{width:1.1em;height:1.1em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-right:7px}.ic.f{fill:currentColor}.ic:only-child{margin:0}
.lg{display:inline-flex;align-items:center;gap:10px;line-height:1}
.lgm{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--p),var(--p2));display:flex;align-items:center;justify-content:center;box-shadow:0 4px 18px #8b5cf666,inset 0 1px 0 #ffffff55;flex:none}.lgm svg{width:22px;height:22px}
.lgt{display:flex;flex-direction:column;gap:4px;font-weight:800;font-size:19px;letter-spacing:.08em}.lgt i{font-style:normal;color:var(--p2);margin-left:4px}
.lgt small{font-size:9px;font-weight:600;letter-spacing:.18em;color:var(--mu);text-transform:uppercase}
@media(max-width:760px){nav .nv{display:none}}
html{scroll-behavior:smooth}#login.land{display:block;min-height:0;padding:0;background:var(--bg)}
.lnav{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:20px;padding:14px 5vw;background:#0d0820d9;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.lnav .sp{flex:1}.lnav a{color:var(--mu);cursor:pointer;font-size:14px}.lnav a:hover{color:var(--tx)}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;padding:70px 5vw 56px;background:radial-gradient(circle at 20% 0,#4c1d95 0,transparent 55%),radial-gradient(circle at 90% 30%,#7e22ce55 0,transparent 50%)}
.hero h1{font-size:clamp(32px,5vw,54px);line-height:1.1;margin:0 0 16px}.hero h1 b{background:linear-gradient(90deg,var(--p2),#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{color:var(--mu);font-size:18px;max-width:520px}
.pill{display:inline-block;border:1px solid var(--line);background:var(--panel);padding:6px 14px;border-radius:20px;font-size:13px;color:var(--p2);margin-bottom:18px}
.stats{display:flex;gap:30px;margin-top:30px;flex-wrap:wrap}.stats b{display:block;font-size:28px;color:var(--p2)}.stats span{font-size:13px;color:var(--mu)}
.mock{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 0 80px #8b5cf655;transform:rotate(1.5deg)}
.sec{padding:64px 5vw}.sec.alt{background:var(--panel)}.sec h2.t{font-size:clamp(24px,3.5vw,36px);text-align:center;margin:0 0 8px}.sec .lead{text-align:center;color:var(--mu);margin:0 auto 36px;max-width:620px}
.ico{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--p),var(--p2));display:flex;align-items:center;justify-content:center;margin-bottom:14px}.ico .ic{margin:0;width:22px;height:22px;color:#fff}
.num{width:38px;height:38px;border-radius:50%;background:var(--p);display:flex;align-items:center;justify-content:center;font-weight:700;margin-bottom:12px}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin:10px auto;max-width:760px}summary{cursor:pointer;font-weight:600}details p{color:var(--mu);margin:10px 0 0}
.cta{text-align:center;padding:72px 5vw;background:radial-gradient(circle at 50% 100%,#6d28d9 0,transparent 60%)}.cta h2{font-size:clamp(26px,4vw,40px);margin:0 0 12px}
.foot{padding:28px 5vw;border-top:1px solid var(--line);color:var(--mu);font-size:13px;display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between}
#auth{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:30;overflow:auto}.btn.lg{padding:14px 26px;font-size:16px}
@media(max-width:860px){.hero{grid-template-columns:1fr;padding-top:40px}.lnav a{display:none}.mock{transform:none}}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th,.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:center}.tbl th:first-child,.tbl td:first-child{text-align:left}.tbl th{color:var(--p2)}.price .per{font-size:15px;color:var(--mu);font-weight:500}.price .ribbon{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--p),var(--p2));padding:3px 12px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}.price{position:relative}
.err{color:var(--ko);font-size:13px;min-height:18px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--p);padding:12px 20px;border-radius:12px;opacity:0;transition:.3s;z-index:40;max-width:90%}
#toast.show{transform:translateX(-50%);opacity:1}
@media(max-width:760px){nav{position:sticky;top:0;width:auto;flex-direction:row;overflow-x:auto;padding:10px}.logo.nv{display:none}main{margin:0;padding:16px}}
</style></head><body>
